name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:msix
      - run: npm run test:msix
      - uses: actions/upload-artifact@v4
        with:
          name: AI-News-Windows
          path: |
            release/AI-News-*-Windows.exe
            release/AI-News-*-Windows-x64.msix
